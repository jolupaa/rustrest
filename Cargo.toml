[package]
name = "rustrest"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "A minimal Express-style HTTP framework for Rust, built on hyper and tokio."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/rustrest"
repository = "https://github.com/jolupaa/rustrest"
homepage = "https://github.com/jolupaa/rustrest"
keywords = ["http", "web", "framework", "hyper", "tokio"]
categories = ["web-programming::http-server", "network-programming"]
exclude = ["AGENTS.md", "CLAUDE.md"]

[features]
default = []
brotli = ["dep:brotli"]
compression = []
full = [
    "brotli",
    "compression",
    "metrics",
    "multipart",
    "openapi",
    "sessions",
    "sse",
    "static-files",
    "tls",
    "tracing",
    "websocket",
]
metrics = []
multipart = []
openapi = []
sessions = []
sse = []
static-files = []
tracing = ["dep:tracing"]
tls = ["dep:tokio-rustls", "dep:rustls-pki-types"]
websocket = []

[dependencies]
brotli = { version = "7", optional = true }
tracing = { version = "0.1", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = [
    "http1",
    "http2",
    "server-auto",
    "server-graceful",
    "tokio",
] }
http-body-util = "0.1"
futures-util = "0.3"
base64 = "0.22"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_html_form = "0.2"
serde_urlencoded = "0.7"
sha1 = "0.10"
hmac = "0.12"
sha2 = "0.10"
httpdate = "1"
tokio-tungstenite = "0.29"
percent-encoding = "2"
headers = "0.4"
cap-std = "4"

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1", "http2"] }
